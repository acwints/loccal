<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8fc">
  <title>Reconnect to Loccal</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; color: #0d1117; background: #f8f8fc; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
    main { max-width: 28rem; padding: max(1.5rem, env(safe-area-inset-left)); }
    h1 { font-size: 1.8rem; letter-spacing: -.03em; }
    p { line-height: 1.6; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1rem; border-radius: 8px; color: white; background: #6d28d9; text-decoration: none; }
    a:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) { :root { color: #e2e6eb; background: #0b0d11; } }
  </style>
</head>
<body><main>
  <h1>Reconnect to your plans.</h1>
  <p>Loccal needs an internet connection to load your calendar and friends. Check your connection, then try again.</p>
  <a href="/dashboard">Try again</a>
</main></body>
</html>
